<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>Coming Soon — ProjectLog</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #212121;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --line: #414141;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1.1;
      letter-spacing: -0.055em;
      font-weight: 750;
    }
    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin: 0 auto 22px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">P</div>
    <h1>Coming Soon</h1>
    <p>Something new is on the way.</p>
  </main>
</body>
</html>
